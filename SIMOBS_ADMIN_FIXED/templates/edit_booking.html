{% extends 'base_admin.html' %}

{% block content %}

<div class="form-box">

    <h2>Edit Booking</h2>

    <form method="POST">

        <div class="form-group">
            <label>Nama Pelanggan</label>
            <input type="text"
                   name="nama_pelanggan"
                   value="{{ data[1] }}"
                   class="form-control">
        </div>

        <div class="form-group">
            <label>Motor</label>
            <input type="text"
                   name="motor"
                   value="{{ data[2] }}"
                   class="form-control">
        </div>

        <div class="form-group">
            <label>Keluhan</label>
            <textarea
                name="keluhan"
                class="form-control"
                rows="4">{{ data[3] }}</textarea>
        </div>

        <div class="form-group">
            <label>Mekanik</label>
            <input type="text"
                   name="mekanik"
                   value="{{ data[4] }}"
                   class="form-control">
        </div>

        <div class="form-group">
            <label>Status</label>

            <select name="status" class="form-control">

                <option value="Menunggu"
                {% if data[5]=='Menunggu' %}selected{% endif %}>
                Menunggu
                </option>

                <option value="Diproses"
                {% if data[5]=='Diproses' %}selected{% endif %}>
                Diproses
                </option>

                <option value="Selesai"
                {% if data[5]=='Selesai' %}selected{% endif %}>
                Selesai
                </option>

            </select>

        </div>

        <button class="btn btn-primary">
            Update Booking
        </button>

        <a href="/booking" class="btn btn-danger">
            Kembali
        </a>

    </form>

</div>

{% endblock %}
