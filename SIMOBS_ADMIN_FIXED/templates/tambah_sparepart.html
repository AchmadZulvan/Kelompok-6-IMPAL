{% extends 'base_admin.html' %}

{% block content %}

<div class="form-box">

    <h2>Tambah Sparepart</h2>

    <form method="POST">

        <div class="form-group">

            <label>Nama Sparepart</label>

            <input
            type="text"
            name="nama_sparepart"
            class="form-control">

        </div>

        <div class="form-group">

            <label>Stok</label>

            <input
            type="number"
            name="stok"
            class="form-control">

        </div>

        <div class="form-group">

            <label>Harga</label>

            <input
            type="number"
            name="harga"
            class="form-control">

        </div>

        <button class="btn btn-primary">
            Simpan Sparepart
        </button>

        <a href="/sparepart"
           class="btn btn-danger">

           Kembali

        </a>

    </form>

</div>

{% endblock %}
