{% extends 'base_admin.html' %}

{% block content %}

<div class="form-box">

    <h2>Edit Sparepart</h2>

    <form method="POST">

        <div class="form-group">

            <label>Nama Sparepart</label>

            <input
            type="text"
            name="nama_sparepart"
            value="{{ data[1] }}"
            class="form-control">

        </div>

        <div class="form-group">

            <label>Stok</label>

            <input
            type="number"
            name="stok"
            value="{{ data[2] }}"
            class="form-control">

        </div>

        <div class="form-group">

            <label>Harga</label>

        <input type="text"
        name="harga"
        value="{{ '{:,.0f}'.format(data[3]|float).replace(',', '.') }}"
        class="form-control">

        </div>

        <button class="btn btn-primary">
            Update Sparepart
        </button>

        <a href="/sparepart"
           class="btn btn-danger">

           Kembali

        </a>

    </form>

</div>

{% endblock %}
