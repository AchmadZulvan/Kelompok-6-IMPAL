{% extends 'base_admin.html' %}

{% block content %}

<div class="table-box">

    <div class="table-header">
        <div>
            <h2>Data Admin</h2>
            <p class="table-subtitle">Daftar seluruh akun admin sistem</p>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width:55px;">No</th>
                <th>Nama</th>
                <th>Username</th>
            </tr>
        </thead>
        <tbody>
        {% for a in data %}
        <tr>
            <td class="td-center">{{ loop.index }}</td>
            <td>{{ a[1] }}</td>
            <td>
                <span style="color:#2563eb; font-weight:600;">@{{ a[2] }}</span>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}
