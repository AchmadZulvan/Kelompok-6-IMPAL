{% extends 'base_admin.html' %}

{% block content %}

<div class="form-box">

    <h2>Tambah Pelanggan</h2>

    <form method="POST">

        <div class="form-group">

            <label>Nama</label>

            <input
            type="text"
            name="nama"
            class="form-control">

        </div>

        <div class="form-group">

            <label>Alamat</label>

            <textarea
            name="alamat"
            rows="4"
            class="form-control"></textarea>

        </div>

        <div class="form-group">

            <label>Telepon</label>

            <input
            type="text"
            name="telepon"
            class="form-control">

        </div>

        <button class="btn btn-primary">
            Simpan Pelanggan
        </button>

        <a href="/pelanggan"
           class="btn btn-danger">

           Kembali

        </a>

    </form>

</div>

{% endblock %}
