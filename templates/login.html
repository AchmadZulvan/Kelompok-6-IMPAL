<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SIMOBS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="phone">
    <div class="login-page">
        <!-- LOGO -->
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SIMOBS">
        </div>

        <!-- PESAN ERROR / INFO -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                <div style="color:red; text-align:center; margin-bottom:10px;">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- FORM -->
        <form action="/login" method="POST">
            <div class="input-box">
                <i class="fa-regular fa-envelope"></i>
                <input type="text" name="user" placeholder="Email atau No HP" required>
            </div>

            <div class="input-box password-box">
                <input type="password" id="password" name="password" placeholder="Password" required>
                <i class="fa-regular fa-eye eye-icon" onclick="togglePassword()"></i>
            </div>

            <button type="submit" class="login-btn">Masuk</button>
        </form>

        <div class="register-text">
            Belum punya akun?
            <a href="/register">Daftar sekarang</a>
        </div>
    </div>
</div>

<script>
function togglePassword(){
    const pass = document.getElementById("password");
    const eye = document.querySelector(".eye-icon");
    if(pass.type === "password"){
        pass.type = "text";
        eye.classList.replace("fa-eye","fa-eye-slash");
    } else {
        pass.type = "password";
        eye.classList.replace("fa-eye-slash","fa-eye");
    }
}
</script>
</body>
</html>
