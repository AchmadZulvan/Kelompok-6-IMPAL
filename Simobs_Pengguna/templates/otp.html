<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP SIMOBS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body.dark-mode .phone { background: #1a2332 !important; }
    </style>
</head>
<body>
<script>
    (function(){ if(localStorage.getItem('darkMode')==='1') document.body.classList.add('dark-mode'); })();
</script>
<div class="phone">
    <div class="otp-overlay">
        <div class="otp-box">

            <div class="otp-icon">📩</div>
            <h1>Masukkan OTP</h1>
            <p class="otp-desc">Kode OTP telah dikirim ke email Anda</p>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div style="color:red; text-align:center; margin-bottom:10px;">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="/verify-login-otp" method="POST">
                <div class="otp-input-group">
                    <input type="text" name="otp" maxlength="6" required>
                </div>
                <button type="submit" class="otp-btn">Verifikasi</button>
            </form>

            <div class="otp-timer">
                ⏰ <span id="countdown">60</span> detik
            </div>

            <div class="otp-footer">
                Tidak menerima kode?
                <a href="/login" id="resendBtn" class="disabled-link">Coba Login Ulang</a>
            </div>

        </div>
    </div>
</div>

<script>
let timeLeft = 60;
const countdown = document.getElementById("countdown");
const resendBtn = document.getElementById("resendBtn");

const timer = setInterval(function(){
    timeLeft--;
    countdown.innerHTML = timeLeft;
    if(timeLeft <= 0){
        clearInterval(timer);
        countdown.innerHTML = "0";
        resendBtn.classList.remove("disabled-link");
    }
}, 1000);
</script>
</body>
</html>
